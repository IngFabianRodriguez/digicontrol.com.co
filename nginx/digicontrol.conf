# ═══════════════════════════════════════════════════════════════════
# Digicontrol GPS Colombia — nginx configuration
# Servidor: digicontrol.com.co
# Ubicación: /etc/nginx/sites-available/digicontrol.com.co
# Enable:   sudo ln -s /etc/nginx/sites-available/digicontrol.com.co
#              /etc/nginx/sites-enabled/digicontrol.com.co
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name digicontrol.com.co www.digicontrol.com.co;

    # Certbot ACME challenge para Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — Main site ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name digicontrol.com.co www.digicontrol.com.co;

    # ── SSL Certificate (Let's Encrypt / Certbot) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/digicontrol.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digicontrol.com.co/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/digicontrol.com.co/chain.pem;

    # ── SSL Hardening ───────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout          5s;

    # OCSP Hardening
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Permissions Policy ───────────────────────────────────────────
    # Solo geolocation (para Google Maps embed), nada de cámara/mic
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), usb=(), payment=()" always;

    # ── Content Security Policy ─────────────────────────────────────
    # Ajusta los dominios según los servicios externos que uses:
    # - Google Fonts (fonts.googleapis.com / fonts.gstatic.com)
    # - Google Maps Embed API
    # - Google Analytics / Tag Manager (opcional)
    # - WhatsApp links (wa.me)
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval'
            https://www.googletagmanager.com
            https://www.google-analytics.com
            https://tagmanager.google.com;
        style-src 'self' 'unsafe-inline'
            https://fonts.googleapis.com;
        font-src 'self'
            https://fonts.gstatic.com;
        img-src 'self' data: blob:
            https://*.googleapis.com
            https://*.gstatic.com
            https://digicontrol.com.co
            https://www.google.com
            https://www.googletagmanager.com;
        connect-src 'self'
            https://www.google-analytics.com
            https://region1.google-analytics.com
            https://analytics.google.com
            https://www.googletagmanager.com;
        frame-src 'self'
            https://www.google.com
            https://www.google.com.mx
            https://www.google.co;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
    " always;

    # ── COOP / COEP ─────────────────────────────────────────────────
    # Solo activar si necesitas SharedArrayBuffer (ej.某些 librerías de audio/video)
    #add_header Cross-Origin-Opener-Policy "same-origin" always;
    #add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # ── Root directory ───────────────────────────────────────────────
    root /var/www/digicontrol.com.co;
    index index.html;

    # ── Logging ─────────────────────────────────────────────────────
    access_log /var/log/nginx/digicontrol.com.co.access.log;
    error_log  /var/log/nginx/digicontrol.com.co.error.log;

    # ── Gzip Compression ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2
        application/vnd.ms-fontobject
        application/x-font-ttf;

    # ── Cache Control para assets estáticos ──────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Assets Angular (dist)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Sitemap y robots.txt ───────────────────────────────────────
    location /sitemap.xml {
        add_header Content-Type application/xml;
    }

    location /robots.txt {
        add_header Content-Type text/plain;
    }

    # ── Main location — Angular SPA (todas las rutas) ─────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Headers de cache para index.html (nunca cache en producción)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ── Health check ────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Bloquear acceso a archivos sensibles ─────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.git|\.env|\.htaccess|README|package\.json|node_modules) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Rate Limiting ───────────────────────────────────────────────
    # Limit IPs que no respeten robots.txt
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
